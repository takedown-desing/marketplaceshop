name: Сборка и публикация лендинга

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей
        working-directory: web
        run: npm ci

      - name: Проверка типов
        working-directory: web
        run: npm run typecheck

      - name: Сборка
        working-directory: web
        run: npm run build

      # Первая версия лендинга остаётся доступной по адресу /v1/
      - name: Забрать /v1/ из текущей ветки публикации
        run: |
          git fetch origin gh-pages --depth 1
          mkdir -p web/dist/v1
          git show origin/gh-pages:v1/index.html > web/dist/v1/index.html
          touch web/dist/.nojekyll

      - name: Публикация в gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Публикация сборки из ${{ github.sha }}'
